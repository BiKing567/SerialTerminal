name: SerialTerminal
options:
  bundleIdPrefix: com.serialdebug
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: SerialTerminal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO

targets:
  SerialTerminal:
    type: application
    platform: macOS
    sources:
      - path: SerialTerminal
        type: group
    resources:
      - path: SerialTerminal/Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serialdebug.SerialTerminal
        INFOPLIST_FILE: SerialTerminal/Info.plist
        CODE_SIGN_ENTITLEMENTS: SerialTerminal/SerialTerminal.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
